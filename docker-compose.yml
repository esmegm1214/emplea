postgres:
  image: postgres:16
  container_name: emplea_postgres
  hostname: postgres
  restart: unless-stopped

  env_file:
    - postgres/.env

  volumes:
    - /home/dashcloudbi/docker/datos/metabase/emplea:/var/lib/postgresql/data

  networks:
    - netemplea

  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U metabase -d metabaseappdb"]
    interval: 10s
    timeout: 5s
    retries: 5
